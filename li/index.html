<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>理·理境 — Logos</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;700&family=Inter:wght@300;400;600&display=swap');
  * { margin: 0; padding: 0; box-sizing: border-box; }
  :root {
    --bg-deep: #0a0e1a;
    --accent: #4fc3f7;
    --accent-dim: #1565c0;
    --text: #e0e6ed;
    --text-muted: #8899aa;
    --border: rgba(79, 195, 247, 0.15);
  }
  body {
    background: var(--bg-deep);
    color: var(--text);
    font-family: 'Inter', 'Noto Serif SC', sans-serif;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
  }
  body::before {
    content: '';
    position: fixed;
    top: -50%; left: -50%;
    width: 200%; height: 200%;
    background: radial-gradient(ellipse at 30% 20%, rgba(21, 101, 192, 0.15) 0%, transparent 50%),
                radial-gradient(ellipse at 70% 80%, rgba(79, 195, 247, 0.08) 0%, transparent 50%);
    z-index: -1;
  }
  .glyph { font-size: 4rem; margin-bottom: 20px; color: var(--accent); text-shadow: 0 0 30px rgba(79, 195, 247, 0.3); }
  h1 { font-family: 'Noto Serif SC', serif; font-size: 2.5rem; color: var(--accent); letter-spacing: 0.15em; margin-bottom: 10px; }
  .subtitle { color: var(--text-muted); font-size: 1rem; font-weight: 300; margin-bottom: 30px; }
  .status { color: var(--text-muted); font-size: 0.85rem; opacity: 0.6; }
  .breadcrumb { margin-top: 40px; }
  .breadcrumb a { color: var(--text-muted); text-decoration: none; font-size: 0.85rem; }
  .breadcrumb a:hover { color: var(--accent); }
</style>
</head>
<body>
  <div class="glyph">🔬</div>
  <h1>理 · 理境</h1>
  <p class="subtitle">生信科研阵地 · Bioinformatics Research</p>
  <p class="status">待激活 — 等待研究方向与文献上传</p>
  <div class="breadcrumb"><a href="/">← 返回总览</a></div>
</body>
</html>
